<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dracula Universal Diff Viewer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root{
--bg:#282A36;--panel:#21222C;--border:#44475A;--text:#F8F8F2;
--accent:#BD93F9;--cyan:#8BE9FD;
}
*{box-sizing:border-box}
body{
margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--text);
background:#282A36;
background-image:radial-gradient(circle at top left,#45356f 0,transparent 30%),radial-gradient(circle at bottom right,#21475b 0,transparent 30%);
}
.container{max-width:1600px;margin:auto;padding:20px}
.toolbar{
display:grid;
grid-template-columns:1fr 1fr 170px;
gap:14px;
align-items:center;
margin-bottom:18px;
}
.drop{
display:flex;
align-items:center;
gap:12px;
height:72px;
padding:12px 18px;
border:2px dashed var(--border);
border-radius:14px;
background:#21222C;
cursor:pointer;
transition:.2s;
overflow:hidden;
}
.drop:hover,.drop.dragging{
border-color:var(--cyan);
background:#303241;
box-shadow:0 0 20px rgba(139,233,253,.25);
}
.icon{font-size:30px}
.meta{display:flex;flex-direction:column;overflow:hidden}
.title{font-weight:600}
.file{font-size:12px;color:#8BE9FD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input{display:none}
button{
height:72px;border:none;border-radius:14px;
background:linear-gradient(135deg,#BD93F9,#8BE9FD);
font-weight:700;font-size:16px;cursor:pointer;
}
#editor{height:78vh;border:1px solid var(--border);border-radius:14px;overflow:hidden}
</style>
</head>
<body>
<div class="container">
<h2>🦇 Dracula Universal Diff Viewer</h2>

<div class="toolbar">
<label class="drop" id="oldCard">
<div class="icon">📄</div>
<div class="meta"><div class="title">Original File</div><div id="oldName" class="file">Drop or click to browse</div></div>
<input id="oldFile" type="file">
</label>

<label class="drop" id="newCard">
<div class="icon">📄</div>
<div class="meta"><div class="title">Modified File</div><div id="newName" class="file">Drop or click to browse</div></div>
<input id="newFile" type="file">
</label>

<button id="compare">Compare</button>
</div>

<div id="editor"></div>
</div>

<script>
let diffEditor;
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs'}});
require(['vs/editor/editor.main'],()=>{
 monaco.editor.defineTheme('dracula',{base:'vs-dark',inherit:true,rules:[],colors:{
 'editor.background':'#282A36',
 'editor.foreground':'#F8F8F2',
 'editorLineNumber.foreground':'#6272A4',
 'diffEditor.insertedTextBackground':'#214D38AA',
 'diffEditor.removedTextBackground':'#4A232BAA'
 }});
 diffEditor=monaco.editor.createDiffEditor(document.getElementById('editor'),{
 theme:'dracula',automaticLayout:true,renderSideBySide:true,readOnly:true,minimap:{enabled:false}
 });
});

function attach(card,input,label){
 card.onclick=()=>input.click();
 input.onchange=()=>{if(input.files[0])label.textContent=input.files[0].name;}
 ['dragenter','dragover'].forEach(e=>card.addEventListener(e,ev=>{
   ev.preventDefault();ev.stopPropagation();card.classList.add('dragging');
 }));
 ['dragleave','dragend','drop'].forEach(e=>card.addEventListener(e,ev=>{
   ev.preventDefault();ev.stopPropagation();card.classList.remove('dragging');
 }));
 card.addEventListener('drop',ev=>{
   const files=ev.dataTransfer.files;
   if(!files.length)return;
   const dt=new DataTransfer();
   dt.items.add(files[0]);
   input.files=dt.files;
   label.textContent=files[0].name;
 });
}
['dragover','drop'].forEach(e=>window.addEventListener(e,x=>{x.preventDefault();}));

attach(oldCard,oldFile,oldName);
attach(newCard,newFile,newName);

async function readUniversal(file){
 let ext=file.name.split('.').pop().toLowerCase();
 if(ext==='xlsx'||ext==='xls'){
   const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
   let out='';
   wb.SheetNames.forEach(n=>{
     out+='===== '+n+' =====\n';
     out+=XLSX.utils.sheet_to_csv(wb.Sheets[n])+'\n';
   });
   return out;
 }
 return await file.text();
}
function lang(name){
 const e=(name.split('.').pop()||'').toLowerCase();
 const m={js:'javascript',ts:'typescript',json:'json',html:'html',css:'css',py:'python',java:'java',cpp:'cpp',c:'c',xml:'xml',md:'markdown'};
 return m[e]||'plaintext';
}
compare.onclick=async()=>{
 if(!oldFile.files[0]||!newFile.files[0]) return alert('Select both files.');
 const a=await readUniversal(oldFile.files[0]);
 const b=await readUniversal(newFile.files[0]);
 diffEditor.setModel({
   original:monaco.editor.createModel(a,lang(oldFile.files[0].name)),
   modified:monaco.editor.createModel(b,lang(newFile.files[0].name))
 });
};
</script>
</body>
</html>
